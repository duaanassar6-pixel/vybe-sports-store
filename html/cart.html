<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VYBE | Shopping Cart</title>

    <link rel="stylesheet" href="../css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        .cart-section {
            padding: 70px 7%;
            min-height: 65vh;
        }

        .cart-section h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 35px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 35px;
            align-items: start;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto auto auto;
            gap: 20px;
            align-items: center;
            padding: 22px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item h3 {
            font-size: 15px;
        }

        .cart-item p {
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        .cart-item input {
            width: 65px;
            padding: 9px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .cart-item button {
            background: none;
            border: none;
            color: #ff5a1f;
            font-weight: 700;
            cursor: pointer;
        }

        .cart-summary {
            background: #f7f7f7;
            padding: 25px;
        }

        .cart-summary h2 {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 14px;
        }

        .summary-total {
            border-top: 1px solid #ddd;
            padding-top: 18px;
            font-size: 18px;
            font-weight: 800;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            text-align: center;
            border: none;
            cursor: pointer;
            margin-top: 25px;
        }

        .empty-cart {
            color: #777;
            padding: 30px 0;
        }

        @media (max-width: 750px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-item {
                grid-template-columns: 1fr auto;
                gap: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <header class="navbar">

        <a href="index.html" class="logo">VYBE<span>.</span></a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="index.html#categories">Categories</a>
            <a href="index.html#about">About</a>
        </nav>

        <div class="nav-actions">
            <a href="login.html">Login</a>
            <a href="cart.html" class="cart-btn">Cart</a>
        </div>

    </header>


    <!-- SHOPPING CART -->
    <section class="cart-section">

        <p class="eyebrow">YOUR SELECTION</p>

        <h1>SHOPPING <span style="color:#ff5a1f;">CART</span></h1>

        <div class="cart-layout">

            <div id="cart-items">
                <p class="empty-cart">Loading cart...</p>
            </div>

            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">AED 0.00</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>

                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="total">AED 0.00</span>
                </div>

                <a href="checkout.html"
                   id="checkout-btn"
                   class="primary-btn checkout-btn">
                    PROCEED TO CHECKOUT →
                </a>

                <a href="products.html"
                   style="display:block;text-align:center;margin-top:18px;font-size:12px;">
                    Continue Shopping
                </a>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-brand">
            <a href="index.html" class="logo">VYBE<span>.</span></a>
            <p>FEEL THE ENERGY. MOVE YOUR WAY.</p>
        </div>

        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="products.html">Shop</a>
            <a href="index.html#about">About</a>
        </div>

        <p class="copyright">
            ©️ 2026 VYBE. All rights reserved.
        </p>

    </footer>


    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>

    <script>

        // Get cart from localStorage
        function getCart() {
            try {
                return JSON.parse(localStorage.getItem("cart") || "[]");
            } catch (error) {
                console.error("Could not read cart:", error);
                return [];
            }
        }

        // Save cart
        function saveCart(cart) {
            localStorage.setItem("cart", JSON.stringify(cart));
        }

        // Display cart items
        function renderCart() {

            const cart = getCart();

            const container = document.getElementById("cart-items");

            let subtotal = 0;

            if (cart.length === 0) {

                container.innerHTML =
                    '<p class="empty-cart">Your cart is empty.</p>';

                document.getElementById("subtotal").textContent = "AED 0.00";
                document.getElementById("total").textContent = "AED 0.00";

                return;
            }

            container.innerHTML = cart.map(item => {

                const price = Number(item.price) || 0;
                const quantity = Number(item.quantity) || 1;
                const stock = Number(item.stock) || 0;
                const lineTotal = price * quantity;

                subtotal += lineTotal;

                return `
                    <div class="cart-item">

                        <div>
                            <h3>${vybe.esc(item.name || "Product")}</h3>
                            <p>AED ${price.toFixed(2)} each</p>
                        </div>

                        <input
                            type="number"
                            min="1"
                            max="${stock}"
                            value="${quantity}"
                            data-action="quantity"
                            data-id="${item.product_id}"
                            aria-label="Product quantity"
                        >

                        <strong>
                            AED ${lineTotal.toFixed(2)}
                        </strong>

                        <button
                            type="button"
                            data-action="remove"
                            data-id="${item.product_id}"
                        >
                            Remove
                        </button>

                    </div>
                `;

            }).join("");

            document.getElementById("subtotal").textContent =
                vybe.money(subtotal);

            document.getElementById("total").textContent =
                vybe.money(subtotal);
        }

        // Handle quantity changes
        document.getElementById("cart-items")
            .addEventListener("change", function(e) {

                if (e.target.dataset.action !== "quantity") return;

                const productId = e.target.dataset.id;
                const quantity = Number(e.target.value);

                if (!Number.isInteger(quantity) || quantity < 1) {
                    renderCart();
                    return;
                }

                const cart = getCart();

                const item = cart.find(p =>
                    String(p.product_id) === String(productId)
                );

                if (!item) return;

                if (quantity > Number(item.stock)) {
                    alert("Only " + item.stock + " items are available.");
                    renderCart();
                    return;
                }

                item.quantity = quantity;

                saveCart(cart);
                renderCart();
            });

        // Handle product removal
        document.getElementById("cart-items")
            .addEventListener("click", function(e) {

                if (e.target.dataset.action !== "remove") return;

                const productId = e.target.dataset.id;

                const cart = getCart().filter(p =>
                    String(p.product_id) !== String(productId)
                );

                saveCart(cart);
                renderCart();
            });

        // Prevent checkout with an empty cart
        document.getElementById("checkout-btn")
            .addEventListener("click", function(e) {

                if (getCart().length === 0) {
                    e.preventDefault();
                    alert("Your cart is empty!");
                }

            });

        // Start
        renderCart();

    </script>

</body>
</html>
