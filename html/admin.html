
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE | Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            padding: 50px 7%;
            min-height: 80vh;
        }

        .admin-heading {
            margin-bottom: 35px;
        }

        .admin-heading h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .admin-heading p {
            color: #777;
        }

        .admin-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .admin-card {
            background: #f7f7f7;
            padding: 30px;
            border-left: 4px solid #ff5a1f;
        }

        .admin-card h3 {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .admin-card .value {
            font-size: 32px;
            font-weight: 800;
        }

        .admin-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .admin-button {
            background: #171717;
            color: white;
            padding: 15px 25px;
            font-size: 13px;
            font-weight: 700;
        }

        .admin-button:hover {
            background: #ff5a1f;
        }

        @media (max-width: 768px) {
            .admin-cards {
                grid-template-columns: 1fr;
            }

            .admin-heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">VYBE<span>.</span></a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="admin.html" class="active">Dashboard</a>
            <a href="admin-products.html">Products</a>
            <a href="admin-orders.html">Orders</a>
        </nav>
    </header>

    <main class="admin-container">

        <div class="admin-heading">
            <h1>ADMIN DASHBOARD</h1>
            <p>Manage your VYBE sports store.</p>
        </div>

        <section class="admin-cards">

            <div class="admin-card">
                <h3>Total Products</h3>
                <p class="value" id="totalProducts">—</p>
            </div>

            <div class="admin-card">
                <h3>Total Orders</h3>
                <p class="value" id="totalOrders">—</p>
            </div>

            <div class="admin-card">
                <h3>Total Sales</h3>
                <p class="value" id="totalSales">—</p>
            </div>

        </section>

        <div class="admin-actions">
            <a href="admin-products.html" class="admin-button">
                MANAGE PRODUCTS
            </a>

            <a href="admin-orders.html" class="admin-button">
                MANAGE ORDERS
            </a>
        </div>

    </main>

</body>
</html>
