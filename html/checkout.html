<<h1>Checkout</h1>
<div id="checkoutBox">
  <form id="checkoutForm">
    <div id="summary"></div>
    <label>Delivery address<textarea id="address" rows="3" required minlength="8"></textarea></label>
    <label>Phone<input id="phone" type="tel" required></label>
    <p>Payment: cash on delivery (demo, no real payment).</p>
    <button class="primary-btn">Place order</button>
    <p id="message" class="auth-msg"></p>
</form>
</div>
</main>
