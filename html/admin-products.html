
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE | Manage Products</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        .admin-container {
            padding: 50px 7%;
            min-height: 80vh;
        }

        h1 {
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .product-form {
            background: #f7f7f7;
            padding: 25px;
            margin-bottom: 35px;
        }

        .product-form h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            font-family: inherit;
        }

        .form-grid textarea {
            grid-column: 1 / -1;
        }

        .admin-btn {
            background: #171717;
            color: white;
            padding: 13px 22px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            margin-top: 15px;
        }

        .admin-btn:hover {
            background: #ff5a1f;
        }

        .product-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        .product-table th,
        .product-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .product-table th {
            background: #171717;
            color: white;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .action-btn {
            padding: 8px 12px;
            border: none;
            cursor: pointer;
            margin: 3px;
            font-weight: 600;
        }

        .edit-btn {
            background: #ff5a1f;
            color: white;
        }

        .delete-btn {
            background: #171717;
            color: white;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">VYBE<span>.</span></a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="admin.html">Dashboard</a>
            <a href="admin-products.html" class="active">Products</a>
            <a href="admin-orders.html">Orders</a>
        </nav>
    </header>

    <main class="admin-container">

        <h1>PRODUCT MANAGEMENT</h1>
        <p class="subtitle">Manage VYBE sports equipment.</p>

        <section class="product-form">
            <h2 id="formTitle">Add New Product</h2>

            <form id="productForm">
                <div class="form-grid">

                    <input type="text" id="productName"
                           placeholder="Product Name" required>

                    <select id="productCategory" required>
                        <option value="">Select Category</option>
                        <option value="Football">Football</option>
                        <option value="Basketball">Basketball</option>
                        <option value="Tennis">Tennis</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Swimming">Swimming</option>
                    </select>

                    <input type="number" id="productPrice"
                           placeholder="Price (AED)"
                           min="0" step="0.01" required>

                    <input type="number" id="productStock"
                           placeholder="Stock Quantity"
                           min="0" step="1" required>

                    <input type="text" id="productImage"
                           placeholder="Image URL">

                    <textarea id="productDescription"
                              placeholder="Product Description"
                              rows="3"></textarea>
                </div>

                <button type="submit" class="admin-btn"
                        id="saveButton">
                    ADD PRODUCT
                </button>

                <button type="button" class="admin-btn"
                        id="cancelButton" hidden>
                    CANCEL EDIT
                </button>
            </form>
        </section>

        <section>
            <h2>Product List</h2>

            <div class="table-wrapper">
                <table class="product-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price (AED)</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productTableBody">
                        <tr>
                            <td colspan="6">
                                Database connection pending.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        // The product form and table are ready.
        // Supabase CRUD operations will be added
        // after the database schema is confirmed.

        document.getElementById("productForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                alert(
                    "Product management will be enabled " +
                    "after Supabase integration."
                );
            });
    </script>

</body>
</html>
