
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYBE | Manage Products</title>

    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        .admin-container {
            padding: 50px 7%;
            min-height: 80vh;
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .product-form {
            background: #f7f7f7;
            padding: 25px;
            margin: 30px 0;
            border-left: 4px solid #ff5a1f;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-grid label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-grid input,
        .form-grid select,
        .form-grid textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            font-family: inherit;
            box-sizing: border-box;
        }

        .admin-button {
            background: #171717;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 700;
            margin: 5px 0;
        }

        .admin-button:hover {
            background: #ff5a1f;
        }

        .delete-button {
            background: #b91c1c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #171717;
            color: white;
        }

        td img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }

        .low-stock {
            color: #b91c1c;
            font-weight: 700;
        }

        #message {
            margin: 20px 0;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">VYBE<span>.</span></a>

        <nav class="nav-links">
            <a href="admin.html">Dashboard</a>
            <a href="admin-products.html">Products</a>
            <a href="admin-orders.html">Orders</a>
        </nav>
    </header>

    <main class="admin-container">

        <h1>MANAGE PRODUCTS</h1>
        <p>Add, update and manage VYBE products.</p>

        <p id="message" aria-live="polite">
            Verifying administrator access...
        </p>

        <div id="adminContent" hidden>

            <section class="product-form">

                <h2 id="formTitle">Add New Product</h2>

                <form id="productForm">

                    <input type="hidden" id="productId">

                    <div class="form-grid">

                        <div>
                            <label for="name">Product Name</label>
                            <input id="name" maxlength="100" required>
                        </div>

                        <div>
                            <label for="category">Category</label>
                            <select id="category" required></select>
                        </div>

                        <div>
                            <label for="price">Price (AED)</label>
                            <input type="number" id="price"
                                   min="0" max="99999999.99"
                                   step="0.01" required>
                        </div>

                        <div>
                            <label for="stock">Stock Quantity</label>
                            <input type="number" id="stock"
                                   min="0" max="2147483647"
                                   step="1" required>
                        </div>

                        <div>
                            <label for="image">Image File Name</label>
                            <input id="image"
                                   maxlength="150"
                                   pattern="[A-Za-z0-9._-]+"
                                   placeholder="product-image.png"
                                   required>
                        </div>

                        <div>
                            <label for="description">Description</label>
                            <textarea id="description"
                                      rows="3" required></textarea>
                        </div>

                    </div>

                    <br>

                    <button type="submit"
                            id="saveButton"
                            class="admin-button">
                        ADD PRODUCT
                    </button>

                    <button type="button"
                            class="admin-button"
                            onclick="resetForm()">
                        CLEAR
                    </button>

                </form>

            </section>

            <h2>Existing Products</h2>

            <div class="table-wrapper">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="productTable"></tbody>
                </table>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/main.js"></script>

    <script>

        const field = id => document.getElementById(id);

        const message = field("message");
        const form = field("productForm");

        let adminProducts = [];

        // Verify administrator access
        async function checkAdmin() {

            const user = await vybe.user();

            if (!user) {
                location.href = "login.html?next=admin-products.html";
                return false;
            }

            const { data, error } = await supabaseClient
                .rpc("is_admin");

            if (error || data !== true) {
                message.textContent =
                    "Access denied. Administrators only.";
                return false;
            }

            return true;
        }

        // Load categories
        async function loadCategories() {

            const { data, error } = await supabaseClient
                .from("category")
                .select("category_id, name")
                .order("name");

            if (error) throw error;

            field("category").innerHTML = data.map(c => `
                <option value="${Number(c.category_id)}">
                    ${vybe.esc(c.name)}
                </option>
            `).join("");
        }

        // READ: Display products
        async function loadAdminProducts() {

            const { data, error } = await supabaseClient
                .from("product")
                .select("*, category(name)")
                .order("product_id");

            if (error) throw error;

            adminProducts = data || [];

            field("productTable").innerHTML =
                adminProducts.map(p => `
                    <tr>
                        <td>${Number(p.product_id)}</td>

                        <td>
                            <img src="../images/${vybe.esc(p.image_url)}"
                                 alt="${vybe.esc(p.name)}">
                        </td>

                        <td>${vybe.esc(p.name)}</td>

                        <td>
                            ${vybe.esc(p.category?.name || "")}
                        </td>

                        <td>${vybe.money(p.price)}</td>

                        <td class="${p.stock <= 5 ? "low-stock" : ""}">
                            ${Number(p.stock)}
                        </td>

                        <td>
                            <button class="admin-button"
                                    onclick="editProduct(${Number(p.product_id)})">
                                EDIT
                            </button>

                            <button class="admin-button delete-button"
                                    onclick="deleteProduct(${Number(p.product_id)})">
                                DELETE
                            </button>
                        </td>
                    </tr>
                `).join("") ||
                '<tr><td colspan="7">No products found.</td></tr>';
        }

        // Fill form with selected product
        function editProduct(id) {

            const p = adminProducts.find(
                item => Number(item.product_id) === id
            );

            if (!p) return;

            field("productId").value = p.product_id;
            field("name").value = p.name;
            field("description").value = p.description;
            field("price").value = p.price;
            field("stock").value = p.stock;
            field("image").value = p.image_url;
            field("category").value = p.category_id;

            field("formTitle").textContent = "Edit Product";
            field("saveButton").textContent = "UPDATE PRODUCT";

            form.scrollIntoView({ behavior: "smooth" });
        }

        // Reset product form
        function resetForm() {

            form.reset();

            field("productId").value = "";
            field("formTitle").textContent = "Add New Product";
            field("saveButton").textContent = "ADD PRODUCT";
        }

        // CREATE and UPDATE
        form.addEventListener("submit", async event => {

            event.preventDefault();

            if (!await checkAdmin()) return;

            const id = field("productId").value;

            const product = {
                name: field("name").value.trim(),
                description: field("description").value.trim(),
                price: Number(field("price").value),
                stock: Number(field("stock").value),
                image_url: field("image").value.trim(),
                category_id: Number(field("category").value)
            };

            if (!product.name || !product.description) {
                message.textContent =
                    "Name and description cannot be empty.";
                return;
            }

            field("saveButton").disabled = true;

            try {

                let result;

                if (id) {

                    result = await supabaseClient
                        .from("product")
                        .update(product)
                        .eq("product_id", Number(id))
                        .select("product_id")
                        .single();

                } else {

                    result = await supabaseClient
                        .from("product")
                        .insert(product)
                        .select("product_id")
                        .single();
                }

                if (result.error) throw result.error;

                resetForm();

                message.textContent = id
                    ? "Product updated successfully."
                    : "Product added successfully.";

                await loadAdminProducts();

            } catch (error) {

                console.error(error);
                message.textContent =
                    "Operation failed: " + error.message;

            } finally {

                field("saveButton").disabled = false;
            }
        });

        // DELETE: Remove selected product
        async function deleteProduct(id) {

            if (!await checkAdmin()) return;

            if (!confirm("Are you sure you want to delete this product?")) {
                return;
            }

            const { error } = await supabaseClient
                .from("product")
                .delete()
                .eq("product_id", id)
                .select("product_id")
                .single();

            if (error) {

                message.textContent = error.code === "23503"
                    ? "Cannot delete a product linked to existing orders."
                    : "Delete failed: " + error.message;

                return;
            }

            message.textContent = "Product deleted successfully.";

            if (Number(field("productId").value) === id) {
                resetForm();
            }

            try {
                await loadAdminProducts();
            } catch (error) {
                message.textContent =
                    "Product deleted, but table refresh failed.";
            }
        }

        // Initialize page
        async function initialize() {

            try {

                if (!await checkAdmin()) return;

                await loadCategories();
                await loadAdminProducts();

                field("adminContent").hidden = false;
                message.textContent = "Product management ready.";

            } catch (error) {

                console.error(error);
                message.textContent =
                    "Could not load products: " + error.message;
            }
        }

        initialize();

    </script>

</body>
</html>
